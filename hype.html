<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&display=swap">
  <link rel="stylesheet" href="hype.css">
</head>
<body>
  <!-- The video is drawn on a fixed 16:9 stage, scaled to fit the window,
       so it looks the same on any screen and in a screen recording. -->
  <div class="viewport">
    <div id="stage" class="stage" aria-live="polite"></div>
  </div>

  <div id="start" class="start">
    <p id="start-logo" class="start-logo"></p>
    <button id="play" class="play" type="button" disabled></button>
    <p id="start-hint" class="start-hint"></p>
    <a id="back-link" class="back-link" href="index.html" hidden></a>
  </div>

  <script src="hype.js"></script>
</body>
</html>
