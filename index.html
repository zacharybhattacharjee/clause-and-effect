<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="round-two.css">
  <link rel="stylesheet" href="app-look.css">
</head>
<body class="round-two">
  <div id="opening" class="opening" aria-hidden="true"></div>
  <p id="draft-note" class="draft-note"></p>

  <header class="masthead">
    <div class="wrap wide">
      <p id="app-name" class="app-name"></p>
      <h1 id="title"></h1>
      <p id="intro" class="intro"></p>
    </div>
  </header>

  <main id="main" class="wrap wide">
    <section id="upload-screen" class="upload-screen"></section>
    <section id="splash" class="splash" hidden></section>
    <div id="reader" class="reader" hidden></div>
  </main>

  <dialog id="tier-dialog" class="tier-dialog" aria-labelledby="tier-dialog-title"></dialog>
  <dialog id="video-dialog" class="video-dialog"></dialog>

  <footer class="site-footer">
    <div class="wrap wide">
      <p id="footer-note"></p>
      <p id="tester-code" class="tester-code"></p>
    </div>
  </footer>

  <script src="engine.js"></script>
  <script src="round-two.js"></script>
</body>
</html>
